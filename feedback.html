<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ideas — Tugendane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"] },
            colors: { transit: { DEFAULT: "#075A45" }, fintech: { DEFAULT: "#0A7CA8" } },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/tugendane.css" />
  </head>
  <body class="font-sans antialiased">
    <div class="app-shell relative mx-auto w-full max-w-[430px] overflow-hidden bg-[#05261d] pb-28">
      <header class="px-5 pt-6">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-sky-300">Commuter voice</p>
        <h1 class="mt-1 text-3xl font-extrabold text-white">Ideas & what you look forward to</h1>
        <p class="mt-2 text-sm leading-6 text-emerald-100/75">
          Tell Tugendane what would make Kigali public transport easier. Notes stay on this device for the prototype.
        </p>
      </header>

      <form id="idea-form" class="mt-6 space-y-3 px-5">
        <input name="name" placeholder="Your name (optional)" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-sm text-white outline-none ring-sky-400 placeholder:text-emerald-100/35 focus:ring-2" />
        <textarea name="message" required rows="5" placeholder="Your idea, a problem on the road, or a feature you look forward to…" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-sm text-white outline-none ring-sky-400 placeholder:text-emerald-100/35 focus:ring-2"></textarea>
        <button class="w-full rounded-2xl bg-gradient-to-r from-transit to-fintech py-4 text-sm font-bold text-white">Share idea</button>
      </form>

      <section class="mt-7 px-5">
        <h2 class="mb-3 text-lg font-bold text-white">From commuters</h2>
        <div id="list" class="space-y-3"></div>
      </section>
      <div id="nav"></div>
    </div>
    <script src="js/app.js"></script>
    <script>
      Tugendane.requirePaid();
      document.getElementById("nav").innerHTML = Tugendane.nav("ideas");

      function render() {
        const ideas = Tugendane.getIdeas();
        const list = document.getElementById("list");
        if (!ideas.length) {
          list.innerHTML = `<p class="rounded-2xl border border-dashed border-white/15 px-4 py-6 text-center text-sm text-emerald-100/60">No ideas yet. Be the first.</p>`;
          return;
        }
        list.innerHTML = ideas
          .map(
            (idea) => `
            <article class="rounded-2xl border border-white/10 bg-white/5 p-4">
              <p class="text-xs font-semibold text-sky-300">${idea.name} · ${idea.when}</p>
              <p class="mt-2 text-sm leading-6 text-emerald-50">${idea.message}</p>
            </article>`
          )
          .join("");
      }

      document.getElementById("idea-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const user = Tugendane.getUser();
        Tugendane.saveIdea({
          name: data.name.trim() || user?.names || "Commuter",
          message: data.message.trim(),
          when: new Date().toLocaleString("en-GB", { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }),
        });
        e.target.reset();
        render();
      });

      render();
    </script>
  </body>
</html>
