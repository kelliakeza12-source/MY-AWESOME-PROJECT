<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap&Go wallet — Tugendane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"] },
            colors: { transit: { DEFAULT: "#075A45" }, fintech: { DEFAULT: "#0A7CA8" } },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/tugendane.css" />
  </head>
  <body class="font-sans antialiased">
    <div class="app-shell relative mx-auto w-full max-w-[430px] overflow-hidden bg-[#05261d] pb-28">
      <header class="px-5 pt-6">
        <a href="index.html" class="text-xs font-semibold text-sky-300">← Home</a>
        <h1 class="mt-2 text-3xl font-extrabold text-white">Tap&Go wallet</h1>
        <p class="mt-2 text-sm leading-6 text-emerald-100/75">
          Load credit here and spend it on the bus when the Tap&Go cashier is far from your stop.
        </p>
      </header>

      <div class="balance-shine mx-5 mt-6 rounded-[28px] p-5">
        <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-white/70">Available</p>
        <p id="balance" class="mt-2 text-4xl font-extrabold text-white">4,500 RWF</p>
      </div>

      <section class="mt-6 px-5">
        <p class="text-xs font-semibold text-emerald-100/70">Quick amounts</p>
        <div class="mt-2 grid grid-cols-4 gap-2" id="amounts"></div>
        <label class="mt-4 block">
          <span class="mb-1.5 block text-xs font-semibold text-emerald-100/80">Custom amount (RWF)</span>
          <input id="custom" type="number" min="100" step="100" placeholder="e.g. 3000" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-sm text-white outline-none ring-sky-400 focus:ring-2" />
        </label>
        <div class="mt-4 grid grid-cols-2 gap-3">
          <button type="button" id="pay-mtn" class="momo-mtn rounded-2xl py-3.5 text-sm font-extrabold">MTN MoMo</button>
          <button type="button" id="pay-airtel" class="momo-airtel rounded-2xl py-3.5 text-sm font-extrabold">Airtel</button>
        </div>
        <p id="status" class="mt-4 text-center text-sm text-sky-200">Choose an amount, then pay.</p>
      </section>
      <div id="nav"></div>
    </div>
    <script src="js/app.js"></script>
    <script>
      Tugendane.requirePaid();
      document.getElementById("nav").innerHTML = Tugendane.nav("home");

      let selected = 2000;
      const presets = [1000, 2000, 5000, 10000];

      function paintBalance() {
        const value = Tugendane.getBalance() ?? 4500;
        document.getElementById("balance").textContent = Tugendane.formatRwf(value);
      }

      function paintAmounts() {
        document.getElementById("amounts").innerHTML = presets
          .map(
            (n) => `
            <button type="button" data-amt="${n}" class="rounded-2xl border px-2 py-3 text-xs font-bold ${
              selected === n ? "border-sky-400 bg-sky-400/15 text-white" : "border-white/10 bg-white/5 text-emerald-100"
            }">${n.toLocaleString()}</button>`
          )
          .join("");
        document.querySelectorAll("[data-amt]").forEach((btn) => {
          btn.addEventListener("click", () => {
            selected = Number(btn.dataset.amt);
            document.getElementById("custom").value = "";
            paintAmounts();
          });
        });
      }

      function amount() {
        const custom = Number(document.getElementById("custom").value);
        return custom > 0 ? custom : selected;
      }

      function topUp(channel) {
        const n = amount();
        if (!n || n < 100) {
          document.getElementById("status").textContent = "Enter at least 100 RWF.";
          return;
        }
        document.getElementById("status").textContent = `Confirming ${n.toLocaleString()} RWF on ${channel}…`;
        setTimeout(() => {
          Tugendane.addBalance(n);
          paintBalance();
          document.getElementById("status").textContent = `${Tugendane.formatRwf(n)} added. Ready for your next ride.`;
        }, 1200);
      }

      document.getElementById("pay-mtn").addEventListener("click", () => topUp("MTN MoMo"));
      document.getElementById("pay-airtel").addEventListener("click", () => topUp("Airtel Money"));
      paintBalance();
      paintAmounts();
    </script>
  </body>
</html>
